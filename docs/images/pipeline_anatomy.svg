<text x="60" y="372" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="normal" fill="#E2E8F0" text-anchor="start">pipeline = [dog_module(), sift_module(), smnn_module(), magsac_module(), to_colmap_module(db=&#39;colmap.db&#39;)]</text>
<text x="60" y="392" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="normal" fill="#E2E8F0" text-anchor="start">run_pairs(pipeline, &#39;../data/ET&#39;, db_name=&#39;database.hdf5&#39;)</text>
