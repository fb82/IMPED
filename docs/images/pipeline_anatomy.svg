<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450"><rect x="0.5" y="0.5" width="999" height="449" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="46" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#111827" text-anchor="start">A pipeline is a list of modules</text>
<text x="40" y="72" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">run_pairs() passes every image pair through the modules in order: each one reads the pipeline data and adds or updates its keys.</text>
