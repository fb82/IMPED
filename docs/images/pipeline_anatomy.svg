<text x="60" y="287" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="start">HDF5 cache (db_name)</text>
<text x="60" y="307" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4B5563" text-anchor="start">Results are stored per image (single-image modules) or per pair (pair modules), keyed by the modules that produced them: unchanged steps are reused.</text>
