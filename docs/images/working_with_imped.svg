<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><rect x="0.5" y="0.5" width="999" height="359" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
