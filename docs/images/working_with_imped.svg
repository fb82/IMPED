<text x="40" y="72" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">Pipelines are plain Python functions: write one, run it, look at the results and refine it, reusing the cache at every iteration.</text>
