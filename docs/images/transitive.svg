<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><rect x="0.5" y="0.5" width="999" height="519" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="46" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#111827" text-anchor="start">Automatic pair selection with a transitive pipeline</text>
